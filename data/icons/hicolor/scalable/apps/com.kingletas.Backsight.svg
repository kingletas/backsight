<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- A surveyor's benchmark: ring, crosshair, and the triangle marking a
       fixed station. Four paths, so it holds together at 16px — which it has
       to, because it is also the window icon and the dock tile. -->
