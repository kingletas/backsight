  <circle cx="64" cy="64" r="34" fill="none" stroke="#1C1B19" stroke-width="5"/>
  <path d="M64 18 V42 M64 86 V110 M18 64 H42 M86 64 H110" stroke="#1C1B19" stroke-width="5" stroke-linecap="round"/>
  <path d="M64 46 L80 75 H48 Z" fill="#C23A3A"/>
</svg>
